openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: FinOptic - Automated AWS Cost Optimization Engine
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: finops
    description: FinOps analysis operations
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /finops/simulate:
    post:
      operationId: simulateDemoData
      tags: [finops]
      summary: Generate demo AWS billing data
      description: Generates a realistic mock AWS Cost and Usage Report and runs anomaly detection on it
      responses:
        "200":
          description: Demo analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"

  /finops/upload:
    post:
      operationId: uploadCsvReport
      tags: [finops]
      summary: Upload AWS CUR CSV file
      description: Accepts an AWS Cost and Usage Report CSV file (multipart/form-data with field 'file'), parses it, and runs anomaly detection
      responses:
        "200":
          description: Analysis result from uploaded CSV
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid or missing CSV file
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

  /finops/live:
    post:
      operationId: liveAwsSync
      tags: [finops]
      summary: Pull live AWS costs and utilization
      description: Assumes a cross-account IAM role via STS, fetches the last 30 days of Cost Explorer costs and CloudWatch CPU metrics, then runs FinOptic waste detection on real infrastructure data.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AwsLiveInput"
      responses:
        "200":
          description: Live AWS analysis result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AnalysisResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSyncError"
        "403":
          description: IAM access denied or insufficient permissions
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSyncError"
        "500":
          description: AWS API error
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LiveSyncError"

  /finops/audit:
    post:
      operationId: runAiAudit
      tags: [finops]
      summary: Run AI optimization audit
      description: Passes detected leak data to an LLM and returns a structured Markdown report with actionable remediation steps
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AuditInput"
      responses:
        "200":
          description: AI-generated audit report
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuditResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"

components:
  schemas:
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status

    LeakRecord:
      type: object
      required:
        - resourceId
        - region
        - leakType
        - monthlyWaste
        - details
      properties:
        resourceId:
          type: string
          description: AWS Resource ID (e.g. i-0abc123, vol-0xyz456)
        region:
          type: string
          description: AWS region (e.g. us-east-1)
        leakType:
          type: string
          enum:
            - UNDERUTILIZED_COMPUTE
            - ORPHANED_STORAGE
            - WASTEFUL_GPU
          description: Category of cloud waste leak
        monthlyWaste:
          type: number
          description: Estimated monthly cost wasted in USD
        details:
          type: string
          description: Human-readable description of the issue

    AnalysisResult:
      type: object
      required:
        - totalMonthlySpend
        - potentialSavings
        - efficiencyScore
        - leaks
        - resourceCount
      properties:
        totalMonthlySpend:
          type: number
          description: Total monthly AWS spend in USD
        potentialSavings:
          type: number
          description: Potential monthly savings in USD
        efficiencyScore:
          type: number
          description: Cloud waste efficiency score 0-100 (100 = perfectly efficient)
        leaks:
          type: array
          items:
            $ref: "#/components/schemas/LeakRecord"
        resourceCount:
          type: integer
          description: Total number of resources scanned

    AuditInput:
      type: object
      required:
        - leaks
        - totalMonthlySpend
        - potentialSavings
      properties:
        leaks:
          type: array
          items:
            $ref: "#/components/schemas/LeakRecord"
        totalMonthlySpend:
          type: number
        potentialSavings:
          type: number

    AuditResult:
      type: object
      required:
        - report
      properties:
        report:
          type: string
          description: AI-generated Markdown report with remediation steps

    AwsLiveInput:
      type: object
      required:
        - roleArn
        - externalId
      properties:
        accountId:
          type: string
          description: AWS Account ID (12 digits) — optional, used for display only
        roleArn:
          type: string
          description: "IAM Role ARN for cross-account access — format: arn:aws:iam::ACCOUNT_ID:role/ROLE_NAME"
        externalId:
          type: string
          description: External ID that matches the IAM role trust policy (security handshake)

    LiveSyncError:
      type: object
      required:
        - error
        - code
      properties:
        error:
          type: string
          description: Human-readable error message
        code:
          type: string
          description: "Machine-readable error code: ACCESS_DENIED | THROTTLED | INVALID_ARN | AWS_ERROR | INVALID_INPUT | INTERNAL_ERROR"
        remediation:
          type: ["string", "null"]
          description: Step-by-step instructions for fixing the IAM policy or configuration

    ErrorResponse:
      type: object
      required:
        - error
      properties:
        error:
          type: string
