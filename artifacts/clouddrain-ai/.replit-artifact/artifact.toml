kind = "web"
previewPath = "/"
title = "CloudDrain AI"
version = "1.0.0"
id = "artifacts/clouddrain-ai"
router = "path"

[[integratedSkills]]
name = "react-vite"
version = "1.0.0"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 22738

[services.development]
run = "pnpm --filter @workspace/clouddrain-ai run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/clouddrain-ai", "run", "build" ]
publicDir = "artifacts/clouddrain-ai/dist/public"
serve = "static"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "22738"
BASE_PATH = "/"
